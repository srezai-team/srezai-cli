name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Ноль зависимостей
        run: node -e "const p=require('./package.json'); if (p.dependencies||p.optionalDependencies) { console.error('dependencies запрещены'); process.exit(1) } if (p.scripts&&(p.scripts.postinstall||p.scripts.prepare)) { console.error('postinstall запрещён'); process.exit(1) }"
      - name: Тесты
        run: node --test
      - name: secret-scan
        run: sh scripts/secret-scan.sh
      - name: Состав пакета
        run: npm pack --dry-run
