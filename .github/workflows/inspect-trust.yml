name: inspect-trust

# ВРЕМЕННЫЙ диагностический workflow: показать сохранённые доверенные
# публикаторы пакета srezai-cli (какие поля записаны в npm). Токен берётся из
# секрета и никуда не печатается. После диагностики файл удаляется.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm CLI 11.5.1+
        run: npm install --global "npm@^11.5.1"
      - name: .npmrc из секрета
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "× нет секрета"; exit 1; fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          echo "секрет получен"
      - name: npm trust list (json)
        run: |
          echo "--- npm trust list srezai-cli --json ---"
          npm trust list srezai-cli --json 2>&1 || echo "команда завершилась с ошибкой (см. выше)"
      - name: npm trust list (обычный вывод)
        run: |
          echo "--- npm trust list srezai-cli ---"
          npm trust list srezai-cli 2>&1 || echo "команда завершилась с ошибкой (см. выше)"
