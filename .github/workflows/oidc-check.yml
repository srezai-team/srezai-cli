name: oidc-check

# Проверка, что npm видит доверенного публикатора, и заодно диагностика
# расхождения настроек: npm хранит пару «репозиторий + workflow + environment».
# Если в настройках npm environment оставили пустым, а в release.yml стоит
# `environment: npm`, обмен токеном отвечает 404 «package not found» — хотя
# человек уверен, что всё сохранил. Поэтому проверяем оба варианта: с окружением
# `npm` и без окружения. По какому из них 200, видно, что именно поправить.
#
# Ничего не публикует: только меняет OIDC-токен GitHub на publish-токен npm.
# Запуск: Actions → oidc-check → Run workflow (ref: main).
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Имя пакета npm для проверки (по умолчанию srezai-cli)"
        required: false
        default: "srezai-cli"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  with-env:
    name: "exchange (environment: npm)"
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm CLI для trusted publishing
        run: npm install --global "npm@^11.5.1"
      - name: обменять OIDC-токен (с окружением npm)
        env:
          PACKAGE: ${{ inputs.package || 'srezai-cli' }}
          CHECK_ENV: npm
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "× нет OIDC-переменных (permissions)"; exit 1; }
          node --input-type=module <<'JS'
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          requestUrl.searchParams.append('audience', 'npm:registry.npmjs.org')
          const r = await fetch(requestUrl, {
            headers: { Accept: 'application/json', Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          const { value: idToken } = await r.json()
          if (!idToken) { console.log('× GitHub не выдал id_token'); process.exit(1) }
          const pkg = process.env.PACKAGE || 'srezai-cli'
          const ex = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(pkg)}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${idToken}` },
          })
          const body = await ex.text()
          console.log(`CHECK_ENV=${process.env.CHECK_ENV || '(none)'} PACKAGE=${pkg} exchange HTTP ${ex.status}`)
          try { const j = JSON.parse(body); console.log(JSON.stringify({ ...j, token: j.token ? '***' : undefined })) }
          catch { console.log(body.slice(0, 500)) }
          if (ex.status !== 200) { console.log(`× нет совпадения для ${pkg} (environment: npm)`); process.exit(1) }
          console.log(`✓ публикатор найден для ${pkg} (environment: npm)`)
          JS

  no-env:
    name: exchange (без окружения)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm CLI для trusted publishing
        run: npm install --global "npm@^11.5.1"
      - name: обменять OIDC-токен (без окружения)
        env:
          PACKAGE: ${{ inputs.package || 'srezai-cli' }}
          CHECK_ENV: none
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "× нет OIDC-переменных (permissions)"; exit 1; }
          node --input-type=module <<'JS'
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          requestUrl.searchParams.append('audience', 'npm:registry.npmjs.org')
          const r = await fetch(requestUrl, {
            headers: { Accept: 'application/json', Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          const { value: idToken } = await r.json()
          if (!idToken) { console.log('× GitHub не выдал id_token'); process.exit(1) }
          const pkg = process.env.PACKAGE || 'srezai-cli'
          const ex = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(pkg)}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${idToken}` },
          })
          const body = await ex.text()
          console.log(`CHECK_ENV=${process.env.CHECK_ENV || '(none)'} PACKAGE=${pkg} exchange HTTP ${ex.status}`)
          try { const j = JSON.parse(body); console.log(JSON.stringify({ ...j, token: j.token ? '***' : undefined })) }
          catch { console.log(body.slice(0, 500)) }
          if (ex.status !== 200) { console.log(`× нет совпадения для ${pkg} (без окружения)`); process.exit(1) }
          console.log(`✓ публикатор найден для ${pkg} (без окружения)`)
          JS
