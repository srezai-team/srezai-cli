name: release

# Публикация по тегу v*: npm trusted publishing (OIDC), без токенов.
# Настройка на npmjs.com: package srezai-cli → Settings → Trusted publishing →
# GitHub Actions, repository srezai-team/srezai-cli, workflow release.yml, environment npm.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # обязательно для OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: node --test
      - run: npm publish --access public
