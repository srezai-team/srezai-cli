name: release

# Публикация по тегу v*: npm trusted publishing (OIDC), без токенов.
# Настройка на npmjs.com: package srezai-cli → Settings → Trusted publishing →
# GitHub Actions, repository srezai-team/srezai-cli, workflow release.yml, environment npm.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # повторная попытка без пересоздания тега (re-run тоже работает)

permissions:
  contents: read
  id-token: write # обязательно для OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: node --test
      - name: npm CLI должен уметь trusted publishing (>=11.5.1)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.env.npm_config_user_agent?.match(/npm\/(\d+)\.(\d+)\.(\d+)/)?.slice(1)?.map(Number)??[]; if(!a||a<11||(a===11&&b<5)||(a===11&&b===5&&c<1)) { console.error("нужен npm >= 11.5.1"); process.exit(1) }'
      - run: npm publish --access public --provenance
