name: release

# Публикация по тегу v*: npm trusted publishing (OIDC), без токенов.
# Настройка на npmjs.com: package srezai-cli → Settings → Trusted publishing →
# GitHub Actions, repository srezai-team/srezai-cli, workflow release.yml, environment npm.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # повторная попытка без пересоздания тега (re-run тоже работает)

permissions:
  contents: read
  id-token: write # обязательно для OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # дублируем на уровне job: environment не должен «съесть» право
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # registry-url НЕ задаём: setup-node@v4 подставляет фиктивный
          # NODE_AUTH_TOKEN, npm уходит в токен-аутентификацию вместо OIDC
          # и получает 404 на PUT (проверено 24.10.2026).
          package-manager-cache: false
      - name: Убедиться, что токен-аутентификации нет (только OIDC)
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then echo "NODE_AUTH_TOKEN был задан — снимаю"; fi
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=" >> "$GITHUB_ENV"
          rm -f "$HOME/.npmrc"
      - name: диагностика OIDC
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC-переменные есть (URL задан)"
          else
            echo "× OIDC-переменных НЕТ — проверь permissions: id-token: write"
          fi
      - run: node --test
      - name: npm CLI для trusted publishing (>=11.5.1, с запасом на будущее)
        run: npm install --global "npm@^11.5.1"

      - name: проверить версию npm
        run: |
          version="$(npm --version)"
          echo "npm $version"
          printf '11.5.1\n%s\n' "$version" | sort -V -C || { echo "нужен npm >= 11.5.1"; exit 1; }
      - run: npm publish --access public --provenance
