name: release

# Публикация по тегу v*: npm trusted publishing (OIDC), без токенов.
# Настройка на npmjs.com: package srezai-cli → Settings → Trusted publishing →
# GitHub Actions, repository srezai-team/srezai-cli, workflow release.yml,
# environment npm (если поле Environment в npm оставили пустым — сработает
# второй job publish-without-env, см. ниже).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # повторная попытка без пересоздания тега (re-run тоже работает)

# contents: write нужен только job github-release, но права задаём на уровне
# workflow: при default_workflow_permissions=read job-уровневый override
# приводил к тому, что job молча пропускался (проверено 25.10.2026).
permissions:
  contents: write
  id-token: write # обязательно для OIDC

jobs:
  # Основная попытка: ровно та конфигурация, что в инструкции владельцу.
  publish-with-env:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # дублируем на уровне job: environment не должен «съесть» право
    outputs:
      published: ${{ steps.publish.outputs.published || steps.already.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # registry-url НЕ задаём: setup-node@v4 подставляет фиктивный
          # NODE_AUTH_TOKEN, npm уходит в токен-аутентификацию вместо OIDC
          # и получает 404 на PUT (проверено 24.10.2026).
      - name: Убедиться, что токен-аутентификации нет (только OIDC)
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then echo "NODE_AUTH_TOKEN был задан — снимаю"; fi
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=" >> "$GITHUB_ENV"
          rm -f "$HOME/.npmrc"
      - name: диагностика OIDC
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC-переменные есть (URL задан)"
          else
            echo "× OIDC-переменных НЕТ — проверь permissions: id-token: write"
          fi
      - run: node --test
      - name: npm CLI для trusted publishing (>=11.5.1, с запасом на будущее)
        run: npm install --global "npm@^11.5.1"
      - name: проверить версию npm
        run: |
          version="$(npm --version)"
          echo "npm $version"
          printf '11.5.1\n%s\n' "$version" | sort -V -C || { echo "нужен npm >= 11.5.1"; exit 1; }
      - name: проверить, не опубликована ли версия уже (повторный запуск)
        id: check
        run: |
          version="$(npm view srezai-cli version 2>/dev/null || true)"
          echo "в npm сейчас: ${version:-<нет>}"
          if [ "$version" = "0.1.0" ]; then echo "already=true" >> "$GITHUB_OUTPUT"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      - name: версия уже в npm — публикацию пропускаем
        id: already
        if: steps.check.outputs.already == 'true'
        run: |
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✓ srezai-cli@0.1.0 уже опубликована, повторная публикация не нужна"
      - name: "npm publish (с environment: npm)"
        id: publish
        if: steps.check.outputs.already != 'true'
        continue-on-error: true
        run: |
          set +e
          npm publish --access public --provenance --loglevel verbose > publish-env.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "✓ пакет опубликован"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "× публикация не удалась (код $code), последние строки лога:"
            tail -40 publish-env.log
          fi
          exit 0

  # Запасной вариант: если в настройках npm поле Environment оставили пустым,
  # первый job получит «package not found». Здесь тот же publish без окружения.
  # Запускается только когда первый job прошёл проверки, но не опубликовал.
  publish-without-env:
    needs: publish-with-env
    if: needs.publish-with-env.result == 'success' && needs.publish-with-env.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published || steps.already.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Убедиться, что токен-аутентификации нет (только OIDC)
        run: |
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=" >> "$GITHUB_ENV"
          rm -f "$HOME/.npmrc"
      - name: npm CLI для trusted publishing
        run: npm install --global "npm@^11.5.1"
      - name: проверить, не опубликована ли версия уже
        id: check
        run: |
          version="$(npm view srezai-cli version 2>/dev/null || true)"
          echo "в npm сейчас: ${version:-<нет>}"
          if [ "$version" = "0.1.0" ]; then echo "already=true" >> "$GITHUB_OUTPUT"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      - name: версия уже в npm — публикацию пропускаем
        id: already
        if: steps.check.outputs.already == 'true'
        run: |
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✓ версия уже опубликована"
      - name: npm publish (без environment)
        id: publish
        if: steps.check.outputs.already != 'true'
        continue-on-error: true
        run: |
          set +e
          npm publish --access public --provenance --loglevel verbose > publish-noenv.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "✓ пакет опубликован (вариант без environment)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "× публикация не удалась (код $code), последние строки лога:"
            tail -40 publish-noenv.log
          fi
          exit 0

  # Итог: пакет обязан быть в npm с provenance и без зависимостей. Красный здесь
  # значит «не опубликовано», а не «непонятно что».
  verify:
    needs: [publish-with-env, publish-without-env]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: пакет и версия в npm (реестру нужно время после публикации)
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            version="$(npm view srezai-cli version 2>/dev/null || true)"
            echo "попытка $i: ${version:-<нет>}"
            [ "$version" = "0.1.0" ] && { echo "✓ srezai-cli@0.1.0 в npm"; exit 0; }
            sleep 10
          done
          echo "× в npm нет srezai-cli@0.1.0"
          exit 1
      - name: provenance-аттестация (с ожиданием)
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            attest="$(npm view srezai-cli@0.1.0 dist.attestations --json 2>/dev/null || echo null)"
            if [ "$attest" != "null" ] && [ -n "$attest" ]; then echo "✓ provenance есть: $attest"; exit 0; fi
            echo "попытка $i: аттестации пока нет"; sleep 10
          done
          echo "× у версии нет provenance-аттестации"
          exit 1
      - name: ноль зависимостей
        run: |
          node -e '
            const p = require("./package.json");
            const deps = Object.keys(p.dependencies || {}).length;
            const peer = Object.keys(p.peerDependencies || {}).length;
            const opt = Object.keys(p.optionalDependencies || {}).length;
            console.log({ deps, peer, opt });
            if (deps + peer + opt !== 0) { console.error("× появились зависимости"); process.exit(1); }
            console.log("✓ зависимостей нет");
          '

  # GitHub Release — для людей, которые ищут пакет не в npm. Отдельная job:
  # публикация токеном read-only, а на создание релиза нужно contents: write.
  github-release:
    needs: verify
    # Явное условие: без него GitHub пропускал job, хотя verify был зелёным
    # (проверено 25.10.2026 на трёх запусках).
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release из тега
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "запуск не по тегу (${GITHUB_REF_TYPE:-неизвестно}) — GitHub Release не создаю"
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "✓ GitHub Release $GITHUB_REF_NAME уже существует"
            exit 0
          fi
          if [ -f RELEASE-NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "srezai-cli $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
